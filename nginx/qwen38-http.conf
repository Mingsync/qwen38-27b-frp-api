# Copy into /etc/nginx/conf.d/ after changing server_name.
# This is for trusted LAN HTTP or certificate bootstrap. Use TLS for public access.
server {
    listen 80;
    server_name llm.example.com;
    client_max_body_size 16m;

    location = /v1/models {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/qwen38-proxy.conf;
    }
    location = /v1/chat/completions {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/qwen38-proxy.conf;
    }
    # Optional custom base URL: http(s)://llm.example.com/qwen/v1
    location = /qwen/v1/models {
        proxy_pass http://127.0.0.1:8000/v1/models;
        include /etc/nginx/snippets/qwen38-proxy.conf;
    }
    location = /qwen/v1/chat/completions {
        proxy_pass http://127.0.0.1:8000/v1/chat/completions;
        include /etc/nginx/snippets/qwen38-proxy.conf;
    }
    location / { return 404; }
}
