# Install only after the certificate files below exist.
# Use either this file or qwen38-http.conf; do not enable both unchanged.
server {
    listen 80;
    server_name llm.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name llm.example.com;
    ssl_certificate /etc/letsencrypt/live/llm.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/llm.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16m;

    location = /v1/models {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/qwen38-proxy.conf;
    }
    location = /v1/chat/completions {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/qwen38-proxy.conf;
    }
    location = /qwen/v1/models {
        proxy_pass http://127.0.0.1:8000/v1/models;
        include /etc/nginx/snippets/qwen38-proxy.conf;
    }
    location = /qwen/v1/chat/completions {
        proxy_pass http://127.0.0.1:8000/v1/chat/completions;
        include /etc/nginx/snippets/qwen38-proxy.conf;
    }
    location / { return 404; }
}
