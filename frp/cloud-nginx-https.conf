# Put under /etc/nginx/conf.d/ (included inside http{} on packaged Ubuntu Nginx).
# Replace llm.example.com and certificate paths before nginx -t.
limit_conn_zone $server_name zone=qwen_frp_total:1m;

server {
    listen 80;
    server_name llm.example.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name llm.example.com;
    ssl_certificate /etc/letsencrypt/live/llm.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/llm.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    client_body_timeout 30s;
    limit_conn_status 429;

    location = /v1/models {
        proxy_pass http://127.0.0.1:18000;
        include /etc/nginx/snippets/qwen38-proxy.conf;
    }
    location = /v1/chat/completions {
        # Admission cap for active HTTP requests, including queued model requests.
        # It does not change the vLLM generation concurrency.
        limit_conn qwen_frp_total 8;
        proxy_pass http://127.0.0.1:18000;
        include /etc/nginx/snippets/qwen38-proxy.conf;
    }
    location = /qwen/v1/models {
        proxy_pass http://127.0.0.1:18000/v1/models;
        include /etc/nginx/snippets/qwen38-proxy.conf;
    }
    location = /qwen/v1/chat/completions {
        limit_conn qwen_frp_total 8;
        proxy_pass http://127.0.0.1:18000/v1/chat/completions;
        include /etc/nginx/snippets/qwen38-proxy.conf;
    }
    location / { return 404; }
}
