# Cloud host, HTTP certificate bootstrap only. No inference proxy over HTTP.
server {
    listen 80;
    server_name llm.example.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 404; }
}
